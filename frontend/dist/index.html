<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Currency Converter</title>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>
<main id="app">

  <!-- ==================== CONVERTER ==================== -->
  <section id="view-main">
    <header class="topbar drag">
      <span id="src-badge" class="src">—</span>
      <span id="src-warn" class="src-warn" hidden>⚠</span>
      <span id="upd-badge" class="upd" data-i18n-title="upd.title">…</span>
      <div class="tools no-drag">
        <button id="btn-refresh" class="icon-btn" data-i18n-title="tray.refresh">⟳</button>
        <button id="btn-settings" class="icon-btn" data-i18n-title="settings.title">⚙</button>
      </div>
    </header>

    <div class="grid">
      <div class="cell">
        <input id="in-amount" class="num no-drag" value="100" autocomplete="off" inputmode="decimal"/>
      </div>
      <button id="swap-amt" class="swap no-drag" data-i18n-title="ui.swap.amounts">⇄</button>
      <div class="cell right">
        <input id="out-result" class="num result no-drag" value="" autocomplete="off" inputmode="decimal"/>
      </div>

      <div class="cell">
        <select id="sel-left" class="no-drag"></select>
      </div>
      <button id="swap-cur" class="swap no-drag" data-i18n-title="ui.swap.currencies">⇄</button>
      <div class="cell">
        <select id="sel-right" class="no-drag"></select>
      </div>

      <div class="rateline right-gap">
        <span id="arr-l" class="arr flat">⠀</span><span id="cap-l" class="cap">—</span>
      </div>
      <div></div>
      <div class="rateline right">
        <span id="arr-r" class="arr flat">⠀</span><span id="cap-r" class="cap">—</span>
      </div>

      <div id="msg-row" class="rateline msg"><span id="msg-text"></span></div>
      <div></div><div></div>
    </div>
  </section>

  <!-- ==================== SETTINGS ==================== -->
  <section id="view-settings" hidden>
    <header class="topbar drag">
      <button id="btn-back" class="icon-btn no-drag" data-i18n-title="settings.back">‹</button>
      <b class="ttl" data-i18n="settings.title">Settings</b>
      <span style="flex:1"></span>
    </header>

    <nav class="tabs no-drag">
      <button class="tab active" data-tab="basic" data-i18n="settings.tab.basic">General</button>
      <button class="tab" data-tab="about" data-i18n="settings.tab.about">About</button>
    </nav>

    <div id="tab-basic" class="tabpane">
      <label class="lbl" data-i18n="settings.default_pair">Default pair</label>
      <div class="defpair">
        <select id="set-left"></select>
        <span>→</span>
        <select id="set-right"></select>
      </div>

      <label class="lbl" for="set-provider" data-i18n="settings.provider">Rates provider</label>
      <select id="set-provider"></select>
      <div id="provider-status" class="prov-status"></div>

      <label class="lbl" for="set-interval" data-i18n="settings.interval">Refresh interval</label>
      <select id="set-interval">
        <option value="15" data-i18n="interval.15">15 minutes</option>
        <option value="30" data-i18n="interval.30">30 minutes</option>
        <option value="60" selected data-i18n="interval.60">1 hour</option>
        <option value="180" data-i18n="interval.180">3 hours</option>
        <option value="360" data-i18n="interval.360">6 hours</option>
      </select>

      <label class="lbl" for="set-theme" data-i18n="settings.theme">Theme</label>
      <select id="set-theme">
        <option value="dark" data-i18n="theme.dark">Dark</option>
        <option value="light" data-i18n="theme.light">Light</option>
      </select>

      <label class="lbl" for="set-lang" data-i18n="settings.language">Language</label>
      <select id="set-lang"></select>

      <div class="switchrow">
        <span data-i18n="settings.autostart">Launch at system startup</span>
        <button id="set-autostart" class="toggle" role="switch" aria-checked="false"></button>
      </div>

      <button id="btn-save" class="primary" data-i18n="settings.save">Save</button>
    </div>

    <div id="tab-about" class="tabpane" hidden>
      <p class="about"><b><span data-i18n="about.name">Currency Converter</span></b> <span id="ver"></span> <span data-i18n="about.tagline">— виджет в трее.</span></p>
      <p class="about" data-i18n="about.sources"></p>
      <p class="about" data-i18n="about.stack"></p>
    </div>

    <div id="toast" class="toast">Saved</div>
  </section>
</main>

  <!-- ==================== CONFIRMATION DIALOG ====================
       Lives inside the same webview: always on top of the widget window,
       styled with the same theme variables. -->
<div id="confirm-overlay" class="confirm-overlay" hidden>
  <div class="confirm" role="dialog" aria-modal="true">
    <p class="confirm-title" data-i18n="confirm.title">Apply changes?</p>
    <p class="confirm-text" data-i18n="confirm.text">Settings have been changed. Save the new values?</p>
    <div class="confirm-actions">
      <button id="confirm-yes" class="primary" data-i18n="confirm.yes">Yes</button>
      <button id="confirm-no" class="ghost" data-i18n="confirm.no">No</button>
    </div>
  </div>
</div>

<script src="/main.js"></script>
</body>
</html>
